name: Sync project READMEs

on:
  push:
    branches: [main]
    paths:
      - 'data/readme-sources.json'
      - 'scripts/sync-readmes.mjs'
      - '.github/workflows/sync-readmes.yml'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync GitHub READMEs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-readmes.mjs

      - name: Commit changed READMEs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/readmes
          if git diff --cached --quiet; then
            echo "No README changes."
            exit 0
          fi
          git commit -m "chore: sync project READMEs"
          git push origin "HEAD:${GITHUB_REF_NAME}"
